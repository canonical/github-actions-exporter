name: github-actions-exporter
base: ubuntu@24.04
version: '0.3.0'
summary: Prometheus exporter for GitHub Actions workflow runs
description: |
  A Prometheus exporter that exposes metrics about the most recent runs
  of specified GitHub Actions workflows.

platforms:
  amd64:
  arm64:

services:
  exporter:
    override: replace
    command: /usr/bin/github-actions-exporter
    startup: enabled

parts:
  exporter:
    plugin: go
    source: .
    build-snaps:
      - go/1.25/stable
  # Without a trust store the exporter cannot complete the TLS handshake with
  # https://api.github.com, and every scrape fails with
  # "x509: certificate signed by unknown authority".
  ca-certificates:
    plugin: nil
    stage-packages:
      - ca-certificates
